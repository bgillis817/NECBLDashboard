name: Deploy NECBL Dashboard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'

concurrency:
  group: deploy-necbl
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Install R packages
        run: |
          install.packages(c("shiny","dplyr","readr","ggplot2","DT","scales","googledrive","googlesheets4","gargle","jsonlite","rsconnect","rmarkdown","knitr"))
        shell: Rscript {0}

      - name: Write Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(
            name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            appDir      = ".",
            appName     = "NECBLDashboard",
            account     = Sys.getenv("SHINYAPPS_ACCOUNT"),
            server      = "shinyapps.io",
            forceUpdate = TRUE,
            lint        = FALSE
          )
        shell: Rscript {0}
