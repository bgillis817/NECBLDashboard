name: Update NECBL Data

on:
  schedule:
    # Runs every night at 2am ET (6am UTC) — before the 4am deploy
    - cron: '0 6 * * *'
  workflow_dispatch:  # allows manual trigger from Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pandas google-api-python-client google-auth

      - name: Update NECBL_All.csv from Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: "1XDTUHKt_B1r4HiJ3jdY6uytz9Ttp_Dgo"
        run: |
          python3 << 'EOF'
          import os
          import io
          import json
          import pandas as pd
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          # Auth
          svc_json = os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          creds_dict = json.loads(svc_json)
          creds = service_account.Credentials.from_service_account_info(
              creds_dict,
              scopes=["https://www.googleapis.com/auth/drive.readonly"]
          )
          service = build("drive", "v3", credentials=creds)
          folder_id = os.environ["DRIVE_FOLDER_ID"]

          # Get all CSV files in folder
          results = service.files().list(
              q=f"'{folder_id}' in parents and mimeType='text/csv' and trashed=false",
              fields="files(id, name, modifiedTime)",
              pageSize=1000
          ).execute()
          files = results.get("files", [])
          print(f"Found {len(files)} CSV files in Drive")

          # Load existing combined file if it exists
          existing_path = "NECBL_All.csv"
          if os.path.exists(existing_path):
              existing = pd.read_csv(existing_path, low_memory=False)
              # Track which filenames are already loaded via a sidecar file
              loaded_path = ".loaded_files.txt"
              if os.path.exists(loaded_path):
                  with open(loaded_path) as f:
                      loaded_names = set(f.read().splitlines())
              else:
                  loaded_names = set()
              print(f"Existing rows: {len(existing)} | Already loaded files: {len(loaded_names)}")
          else:
              existing = pd.DataFrame()
              loaded_names = set()
              print("No existing file — loading all files")

          # Download only new files
          new_dfs = []
          new_names = []
          for file in files:
              if file["name"] in loaded_names:
                  continue
              try:
                  request = service.files().get_media(fileId=file["id"])
                  fh = io.BytesIO()
                  downloader = MediaIoBaseDownload(fh, request)
                  done = False
                  while not done:
                      _, done = downloader.next_chunk()
                  fh.seek(0)
                  df = pd.read_csv(fh, low_memory=False)
                  new_dfs.append(df)
                  new_names.append(file["name"])
                  print(f"  + {file['name']} ({len(df)} rows)")
              except Exception as e:
                  print(f"  ! Skipped {file['name']}: {e}")

          # Only keep columns the app actually needs
          KEEP_COLS = [
              'PitchNo','Date','Time','PAofInning','PitchofPA',
              'Pitcher','PitcherId','PitcherThrows','PitcherTeam',
              'Batter','BatterId','BatterSide','BatterTeam',
              'Inning','Top/Bottom','Outs','Balls','Strikes',
              'TaggedPitchType','AutoPitchType','PitchCall','KorBB',
              'TaggedHitType','PlayResult','RelSpeed','SpinRate','SpinAxis',
              'Tilt','RelHeight','RelSide','Extension',
              'VertBreak','InducedVertBreak','HorzBreak',
              'PlateLocHeight','PlateLocSide','ExitSpeed','Angle',
              'Direction','Bearing','Distance','LastTrackedDistance','Stadium',
              'HomeTeam','AwayTeam','GameID','PitchUID'
          ]

          if len(new_dfs) == 0:
              print("No new files to add — nothing to update")
          else:
              # Append new data
              combined = pd.concat([existing] + new_dfs, ignore_index=True)
              # Trim to essential columns only
              keep = [c for c in KEEP_COLS if c in combined.columns]
              combined = combined[keep]

              # Normalize dates and keep only 2025+
              combined['Date'] = pd.to_datetime(combined['Date'], errors='coerce')
              combined = combined[combined['Date'].dt.year >= 2025]
              # Save dates in consistent ISO format to avoid re-parse issues
              combined['Date'] = combined['Date'].dt.strftime('%Y-%m-%d')

              combined.to_csv(existing_path, index=False)
              year_counts = combined['Date'].str[:4].value_counts().to_dict()
              print(f"Updated NECBL_All.csv: {len(combined)} rows, ***{year_counts}***")

              # Update loaded files tracker
              all_loaded = loaded_names | set(new_names)
              with open(".loaded_files.txt", "w") as f:
                  f.write("\n".join(sorted(all_loaded)))

          EOF

      - name: Apply pitch reclassification corrections
        run: |
          python3 << 'EOF'
          import os
          import pandas as pd

          corrections_path = "corrections.csv"
          data_path = "NECBL_All.csv"

          if not os.path.exists(corrections_path):
              print("No corrections.csv found — skipping")
          elif not os.path.exists(data_path):
              print("No NECBL_All.csv found — skipping")
          else:
              corrections = pd.read_csv(corrections_path, low_memory=False)
              if len(corrections) == 0:
                  print("corrections.csv is empty — skipping")
              else:
                  data = pd.read_csv(data_path, low_memory=False)
                  data['Date'] = pd.to_datetime(data['Date'], errors='coerce')

                  # Build a lookup key matching the app's RowID: Pitcher__Date__PitchNo
                  data['_RowID'] = (
                      data['Pitcher'].astype(str) + "__" +
                      data['Date'].dt.strftime('%Y-%m-%d') + "__" +
                      data['PitchNo'].astype(str)
                  )

                  corrections['Date'] = pd.to_datetime(corrections['Date'], errors='coerce')
                  corrections['_RowID'] = (
                      corrections['Pitcher'].astype(str) + "__" +
                      corrections['Date'].dt.strftime('%Y-%m-%d') + "__" +
                      corrections['PitchNo'].astype(str)
                  )

                  # Keep only the most recent correction per RowID
                  corrections = corrections.sort_values('Timestamp').drop_duplicates('_RowID', keep='last')

                  # Split: rows marked for removal vs. type reclassifications
                  DELETE_SENTINEL = "__DELETE__"
                  del_mask  = corrections['NewType'].astype(str) == DELETE_SENTINEL
                  deletions = corrections[del_mask]
                  retypes   = corrections[~del_mask]

                  type_map = dict(zip(retypes['_RowID'], retypes['NewType']))
                  matched = data['_RowID'].isin(type_map)
                  n_matched = matched.sum()

                  matched_ids = set(data.loc[matched, '_RowID'])

                  data.loc[matched, 'TaggedPitchType'] = data.loc[matched, '_RowID'].map(type_map)

                  # Physically drop pitches marked for removal (e.g. Trackman
                  # misattributed them to the wrong pitcher).
                  n_deleted = 0
                  deleted_ids = set()
                  if len(deletions) > 0:
                      del_ids = set(deletions['_RowID'])
                      drop_mask = data['_RowID'].isin(del_ids)
                      n_deleted = int(drop_mask.sum())
                      deleted_ids = set(data.loc[drop_mask, '_RowID'])
                      data = data[~drop_mask]
                      print(f"Removed {n_deleted} pitch row(s) marked for deletion")

                  matched_ids |= deleted_ids
                  data = data.drop(columns=['_RowID'])
                  data['Date'] = data['Date'].dt.strftime('%Y-%m-%d')

                  data.to_csv(data_path, index=False)
                  print(f"Applied {n_matched} corrections out of {len(retypes)} retype(s) logged")
                  print(f"Deleted {n_deleted} row(s) from {len(deletions)} deletion instruction(s)")
                  print(f"NECBL_All.csv now has {len(data)} rows")

                  # Keep any correction that matched no row instead of silently
                  # destroying it, so a bad key can be investigated rather than lost.
                  leftover = corrections[~corrections['_RowID'].isin(matched_ids)].drop(columns=['_RowID'])
                  if len(leftover) > 0:
                      print(f"WARNING: {len(leftover)} correction(s) matched no row — keeping them in corrections.csv")
                      for _, r in leftover.head(10).iterrows():
                          print(f"  unmatched: {r.get('Pitcher')} | {r.get('Date')} | PitchNo={r.get('PitchNo')}")
                  leftover.to_csv(corrections_path, index=False)
                  print(f"corrections.csv now holds {len(leftover)} pending row(s)")
          EOF

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NECBL_All.csv .loaded_files.txt corrections.csv || true
          git diff --staged --quiet || git commit -m "Auto-update NECBL data $(date +'%Y-%m-%d')"
          git push
